<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Homepage</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <header>
      <i class="emoji">🍀</i>
      <i class="fa-solid fa-bars menu-icon"></i>
    </header>
    <div class="container flex">
      <div class="header">
        <i class="header-icon"> </i>
        <h2 id="smart-farm">Smart Farm Monitoring System</h2>
      </div>
      <div class="paragraph">
        <p>
          Empowering modern agriculture with real-time environment data
          analysis. Our system uses advanced Fuzzy Logic to monitor soil
          moisture, temperature, and humidity, providing you with actionable
          recommendation to optimize your crop yield.
        </p>
        <div class="button flex">
          <button class="login-dashboard-btn btn">Login to Dashboard</button
          ><button class="create-act-btn btn">Create New Account</button>
        </div>
      </div>
    </div>
  </body>
</html>
